<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Automation Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-storage-compat.js"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/css/styles.css">
    <!-- Favicon -->
    <link rel="icon" href="assets/favicon.ico">
</head>
<body class="bg-gray-100 dark:bg-gray-900 h-screen overflow-hidden">
    <div id="app" class="flex h-full">
        <!-- Sidebar -->
        <div class="w-1/4 border-r border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 flex flex-col">
            <!-- Header -->
            <div class="p-3 bg-gray-50 dark:bg-gray-700 flex justify-between items-center">
                <div class="flex items-center">
                    <img src="assets/logo.svg" alt="Logo" class="h-8 w-8 mr-2">
                    <h1 class="text-lg font-semibold dark:text-white">WhatsApp Automation</h1>
                </div>
                <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-600">
                    <svg class="w-5 h-5 dark:hidden" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                    </svg>
                    <svg class="w-5 h-5 hidden dark:block" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path>
                    </svg>
                </button>
            </div>
            
            <!-- Search -->
            <div class="p-3 bg-white dark:bg-gray-800">
                <div class="relative">
                    <input type="text" placeholder="Search or start new chat" class="w-full py-2 px-4 pl-10 bg-gray-100 dark:bg-gray-700 rounded-lg focus:outline-none dark:text-white">
                    <svg class="absolute left-3 top-2.5 h-5 w-5 text-gray-500 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
            </div>
            
            <!-- Chats List -->
            <div id="chats-list" class="flex-1 overflow-y-auto">
                <!-- Chats will be loaded here dynamically -->
                <div class="animate-pulse p-4 text-center text-gray-500 dark:text-gray-400">
                    Loading chats...
                </div>
            </div>
            
            <!-- User Profile -->
            <div class="p-3 bg-gray-50 dark:bg-gray-700 flex items-center">
                <div class="w-10 h-10 rounded-full bg-gray-300 dark:bg-gray-600 flex items-center justify-center text-gray-600 dark:text-gray-300 font-semibold">
                    <span id="user-initial">U</span>
                </div>
                <div class="ml-3 flex-1">
                    <p id="user-name" class="text-sm font-medium dark:text-white">User</p>
                    <p id="user-email" class="text-xs text-gray-500 dark:text-gray-400">user@example.com</p>
                </div>
                <button id="logout-btn" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-600">
                    <svg class="w-5 h-5 text-gray-500 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- Main Content Area -->
        <div id="chat-container" class="flex-1 flex flex-col bg-gray-50 dark:bg-gray-700">
            <!-- Default state when no chat is selected -->
            <div id="empty-state" class="flex-1 flex flex-col items-center justify-center p-6 text-center">
                <div class="w-24 h-24 mb-4 rounded-full bg-gray-200 dark:bg-gray-600 flex items-center justify-center">
                    <svg class="w-12 h-12 text-gray-400 dark:text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                    </svg>
                </div>
                <h2 class="text-xl font-semibold text-gray-700 dark:text-gray-300 mb-2">Select a chat to start messaging</h2>
                <p class="text-gray-500 dark:text-gray-400 max-w-md">Your WhatsApp messages will appear here. Select a contact from the sidebar or start a new conversation.</p>
            </div>
            
            <!-- Chat panels will be dynamically added here -->
        </div>
        
        <!-- Right Sidebar (optional) -->
        <div id="right-sidebar" class="w-1/4 border-l border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 hidden">
            <!-- Right sidebar content will be loaded here -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/firebase.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
